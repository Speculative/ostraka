<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Ostraka — a workspace for durable conversations with coding agents."
    />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/style.css" />
    <title>Ostraka</title>
    <script src="/select.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body class="sp-app">
    <a class="skip" href="#detail">Skip to conversation</a>
    <div class="workspace">
      <aside class="sidebar" aria-label="Workspace navigation">
        <a class="brand" href="#inbox"
          ><span class="brand-monogram" aria-hidden="true">O</span
          ><span>ostraka<span class="brand-sub">agent workspace</span></span></a
        >
        <div class="project-label" id="project-name">Workspace</div>
        <nav id="navigation" aria-label="Views"></nav>
        <div class="sidebar-bottom">
          <span id="connection" role="status">Connecting…</span
          ><button id="pause" class="quiet" hidden>Pause agents</button
          ><span class="local-note">Local workspace · live updates</span>
        </div>
      </aside>
      <section class="collection" aria-label="Items">
        <header class="collection-header">
          <div>
            <h1 id="view-title">Inbox</h1>
          </div>
          <button id="new-item" title="New item (N)">+ New</button>
        </header>
        <div class="filters">
          <label class="search"
            ><svg
              class="nav-icon"
              aria-hidden="true"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="square"
            >
              <circle cx="10" cy="10" r="7" />
              <path d="m15 15 6 6" /></svg
            ><input
              id="search"
              type="search"
              placeholder="Search conversations…"
              aria-label="Search items" /></label
          ><select id="group-filter" aria-label="Filter by group">
            <option value="">All groups</option>
          </select>
          <select id="status-filter" aria-label="Filter by status">
            <option value="">All statuses</option>
            <option value="pending-user">Your turn</option>
            <option value="agent-acknowledged">Working</option>
            <option value="pending-agent">Queued</option>
            <option value="active">Active</option>
            <option value="backlog">Backlog</option>
            <option value="proposed">Proposed</option>
          </select>
        </div>
        <div id="item-list" class="item-list" aria-live="polite"></div>
        <footer class="collection-footer">
          <span id="list-count"></span
          ><span class="desktop-hint">N new · / search</span>
        </footer>
      </section>
      <main id="detail" class="detail" tabindex="-1">
        <div class="empty">
          <span class="empty-mark">◈</span>
          <h2>A little space to think.</h2>
          <p>Select a conversation to pick up where you left off.</p>
        </div>
      </main>
    </div>
    <dialog id="modal">
      <form id="modal-form">
        <header>
          <h2 id="modal-title"></h2>
          <button
            type="button"
            id="modal-close"
            class="icon-button"
            aria-label="Close dialog"
          >
            ×
          </button>
        </header>
        <div id="modal-fields"></div>
        <p id="modal-error" class="error" role="alert" hidden></p>
        <footer>
          <button type="button" id="modal-cancel">Cancel</button
          ><button type="submit" id="modal-submit" class="primary">Save</button>
        </footer>
      </form>
    </dialog>
    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
